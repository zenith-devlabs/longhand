<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longhand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff914d;
    --accent-soft: rgba(255, 145, 77, 0.14);
    --on-accent: #2a1a0d;
    --display: "Playfair Display", Georgia, serif;
    --title: "Archivo", ui-sans-serif, system-ui, sans-serif;
    --body: "Nunito Sans", ui-sans-serif, system-ui, sans-serif;
  }

  html[data-theme="light"] {
    --bg: #f1f1f1;
    --fg: #323232;
    --muted: #6f6f6f;
    --muted-dim: #9a9a9a;
    --line: rgba(50, 50, 50, 0.14);
    --surface: rgba(50, 50, 50, 0.04);
  }
  html[data-theme="dark"] {
    --bg: #323232;
    --fg: #f1f1f1;
    --muted: #a8a8a8;
    --muted-dim: #7a7a7a;
    --line: rgba(241, 241, 241, 0.16);
    --surface: rgba(241, 241, 241, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 20px 64px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }

  body::before {
    content: "";
    position: fixed;
    top: -260px;
    left: 50%;
    transform: translateX(-50%);
    width: 720px;
    height: 600px;
    background: radial-gradient(ellipse at center, var(--accent-soft), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 94px);
  }

  header.brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand-left { display: flex; align-items: center; gap: 12px; }

  .brand-logo {
    width: 26px;
    height: 34px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    flex: none;
  }

  .wordmark {
    font-family: var(--display);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.01em;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: none;
    color: var(--fg);
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 17px; height: 17px; }
  html[data-theme="light"] .icon-moon { display: block; }
  html[data-theme="light"] .icon-sun { display: none; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="dark"] .icon-sun { display: block; }

  .tagline {
    font-family: var(--body);
    font-size: 14.5px;
    color: var(--muted);
    margin-top: 14px;
    line-height: 1.5;
  }

  .stage { margin: auto 0; padding: 48px 0 8px; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .kicker {
    font-family: var(--title);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .datestamp {
    font-family: var(--title);
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .tag {
    font-family: var(--title);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 11px;
  }

  .prompt {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(27px, 6vw, 39px);
    line-height: 1.34;
    letter-spacing: -0.005em;
    color: var(--fg);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .prompt.swap { opacity: 0; transform: translateY(8px); }

  .caret {
    display: inline-block;
    width: 3px;
    height: 0.88em;
    margin-left: 5px;
    background: var(--accent);
    transform: translateY(3px);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .controls { display: flex; gap: 10px; margin-top: 34px; flex-wrap: wrap; }

  button { font-family: var(--title); cursor: pointer; border: none; background: none; color: inherit; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 20px;
    border-radius: 999px;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.06s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { border: 1px solid var(--line); color: var(--fg); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn.ghost.saved { border-color: var(--accent); color: var(--accent); }
  .icon { width: 15px; height: 15px; flex: none; }

  .save-note {
    font-family: var(--body);
    font-size: 12.5px;
    color: var(--muted-dim);
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .save-note svg { width: 13px; height: 13px; flex: none; }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 40px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
  }
  .chip {
    font-family: var(--title);
    font-size: 12px;
    letter-spacing: 0.01em;
    color: var(--muted);
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--surface);
    transition: color 0.15s ease, background 0.15s ease;
  }
  .chip:hover { color: var(--fg); }
  .chip.active { color: var(--accent); background: var(--accent-soft); }

  .saved-block { margin-top: 44px; }
  .saved-head {
    font-family: var(--title);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-dim);
    margin-bottom: 6px;
  }
  .saved-sub {
    font-family: var(--body);
    font-size: 12.5px;
    color: var(--muted-dim);
    margin-bottom: 14px;
  }
  .saved-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .saved-text {
    font-family: var(--body);
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--fg);
    flex: 1;
  }
  .saved-actions { display: flex; gap: 4px; flex: none; }
  .saved-btn {
    color: var(--muted-dim);
    padding: 3px 5px;
    border-radius: 6px;
    display: inline-flex;
  }
  .saved-btn:hover { color: var(--accent); }
  .saved-btn svg { width: 15px; height: 15px; }
  .saved-empty {
    font-family: var(--body);
    font-size: 13.5px;
    color: var(--muted-dim);
    font-style: italic;
  }

  .toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--fg);
    color: var(--bg);
    font-family: var(--title);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 5;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    .prompt, .btn, .chip, .toast, body, .brand-logo { transition: none; }
    .prompt.swap { opacity: 1; transform: none; }
  }
  @media (max-width: 480px) {
    .stage { padding: 30px 0 4px; }
    .btn { padding: 10px 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="brand-left">
        <span class="brand-logo" role="img" aria-label="Longhand logo"></span>
        <span class="wordmark">Longhand</span>
      </div>
      <button class="theme-toggle" id="theme" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <p class="tagline">A fresh writing prompt every day, plus a bank to pull from whenever you need a spark.</p>

    <main class="stage">
      <div class="eyebrow">
        <span class="kicker" id="kicker">Today's prompt</span>
        <span class="datestamp" id="datestamp"></span>
        <span class="tag" id="tag"></span>
      </div>

      <p class="prompt" id="prompt" aria-live="polite"></p>

      <div class="controls">
        <button class="btn primary" id="another">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          Another
        </button>
        <button class="btn ghost" id="copy">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy to clipboard
        </button>
        <button class="btn ghost" id="save">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          Save prompt
        </button>
      </div>

      <p class="save-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Saved prompts stay only for this session and clear when you close the tab.
      </p>

      <div class="filters" id="filters"></div>
    </main>

    <section class="saved-block">
      <div class="saved-head">Saved <span id="saved-count"></span></div>
      <div class="saved-sub">Your picks for this session. They disappear once the tab is closed.</div>
      <div id="saved-list"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
const PROMPTS = [
  { c: "First line", t: "Write the opening sentence of a story that begins with someone lying." },
  { c: "First line", t: "Start with a line of dialogue that ends a friendship." },
  { c: "First line", t: "Begin in the middle of an argument that no one will win." },
  { c: "First line", t: "Open with a character noticing something they were not meant to see." },
  { c: "First line", t: "Write a first line that promises a death and delivers a wedding." },
  { c: "First line", t: "Start a story with the sentence a character has been rehearsing all week." },
  { c: "Character", t: "Give a character a secret they would rather die than explain, then make them explain it." },
  { c: "Character", t: "Write about someone who is kind for the wrong reasons." },
  { c: "Character", t: "Invent a person defined entirely by what they refuse to do." },
  { c: "Character", t: "Describe a character through the contents of their bag." },
  { c: "Character", t: "Write someone who is lying to everyone except the reader." },
  { c: "Character", t: "A person inherits a habit they hate from a parent they loved. Show it surface." },
  { c: "Character", t: "Write about a character who is early to everything, and why." },
  { c: "Setting", t: "Describe a room that has been waiting for someone to come home." },
  { c: "Setting", t: "Write a place that is beautiful and unsafe at the same time." },
  { c: "Setting", t: "Set a scene in the last open shop on a street that is closing down." },
  { c: "Setting", t: "Describe a city entirely through its sounds at three in the morning." },
  { c: "Setting", t: "Write about a house that remembers more than its owners do." },
  { c: "Conflict", t: "Two people want the same thing for opposite reasons. Write the moment it breaks." },
  { c: "Conflict", t: "Write a scene where the polite thing and the honest thing are not the same." },
  { c: "Conflict", t: "Someone keeps a promise that costs them everything. Show the cost, not the promise." },
  { c: "Conflict", t: "Write a negotiation where both sides are bluffing." },
  { c: "Conflict", t: "A small favor turns into a debt that cannot be repaid." },
  { c: "Conflict", t: "Write the quietest argument two people have ever had." },
  { c: "Dialogue", t: "Write a conversation where neither person says what they mean." },
  { c: "Dialogue", t: "Two strangers share a table and slowly realize they have met before." },
  { c: "Dialogue", t: "Write an apology that is really an accusation." },
  { c: "Dialogue", t: "A phone call where one person already knows how it ends." },
  { c: "Dialogue", t: "Write a goodbye disguised as a hello." },
  { c: "Dialogue", t: "Two coworkers, one elevator, thirty floors, one secret." },
  { c: "Sensory", t: "Write a scene built entirely around one smell." },
  { c: "Sensory", t: "Describe a meal that tastes like a memory the character would rather forget." },
  { c: "Sensory", t: "Use the sound of rain to say something the character cannot." },
  { c: "Sensory", t: "Write about the texture of a fabric someone has kept for decades." },
  { c: "Sensory", t: "Describe morning light in a room where something went wrong the night before." },
  { c: "Sensory", t: "Describe waiting, without ever using the word." },
  { c: "What if", t: "Write a world where people trade years of their life like currency. Start small." },
  { c: "What if", t: "One morning, everyone wakes remembering a stranger's dream. Follow one person." },
  { c: "What if", t: "A town where it is illegal to be alone. Write the person who breaks the rule." },
  { c: "What if", t: "Letters begin arriving from a version of your character who made different choices." },
  { c: "What if", t: "Every clock in the world runs backward for one hour. Write that hour." },
  { c: "Memory", t: "Write about the last time two people were happy and did not know it." },
  { c: "Memory", t: "Describe a grief that shows up as something ordinary, like reorganizing a shelf." },
  { c: "Memory", t: "Write the moment a childhood belief quietly dies." },
  { c: "Memory", t: "Someone returns to a place and it is smaller than they remembered. Write why that hurts." },
  { c: "Memory", t: "Write about forgiving someone who never asked for it." },
  { c: "Memory", t: "Write a reunion that neither person wanted." },
  { c: "Object", t: "Write a story that turns on a single borrowed umbrella." },
  { c: "Object", t: "An object outlives the person who loved it. Follow where it goes next." },
  { c: "Object", t: "Write about a key that no longer opens anything." },
  { c: "Object", t: "A gift is regifted three times. Trace its path and its meaning." },
  { c: "Object", t: "Write the history of a scar." },
  { c: "Object", t: "Write about the thing a character keeps meaning to throw away." },
  { c: "Point of view", t: "Tell a familiar fairy tale from the view of whoever cleans up afterward." },
  { c: "Point of view", t: "Write a scene from the perspective of the one who is wrong." },
  { c: "Point of view", t: "Narrate an ordinary morning as if it were the most important day in history." },
  { c: "Point of view", t: "Write a crowd from the view of the one person not enjoying it." },
  { c: "Point of view", t: "Tell a love story from the point of view of the room it happens in." },
  { c: "Structure", t: "Write a story in exactly five sentences, each shorter than the last." },
  { c: "Structure", t: "Tell a whole relationship using only things left on a kitchen counter." },
  { c: "Structure", t: "Write a scene twice: once as comedy, once as tragedy, same events." },
  { c: "Structure", t: "Begin and end with the same sentence, changed by everything between." },
  { c: "Structure", t: "Write a story where nothing happens but everything changes." },
  { c: "Structure", t: "Write about the last customer of the day." },
  { c: "Structure", t: "A stranger returns something you did not know you had lost." }
];

const CATEGORIES = ["All", ...Array.from(new Set(PROMPTS.map(p => p.c)))];
let filter = "All";
let current = null;
let saved = [];

const $ = id => document.getElementById(id);
const promptEl = $("prompt");

function dailyIndex() {
  const d = new Date();
  const key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  let h = key;
  h = (h ^ (h << 13)) >>> 0;
  h = (h ^ (h >> 17)) >>> 0;
  h = (h ^ (h << 5)) >>> 0;
  return h % PROMPTS.length;
}

function setDate() {
  $("datestamp").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
}

function render(prompt, isDaily) {
  current = prompt;
  $("kicker").textContent = isDaily ? "Today's prompt" : "Prompt";
  $("tag").textContent = prompt.c;
  promptEl.classList.add("swap");
  setTimeout(() => {
    promptEl.innerHTML = "";
    promptEl.append(document.createTextNode(prompt.t));
    const caret = document.createElement("span");
    caret.className = "caret";
    promptEl.append(caret);
    promptEl.classList.remove("swap");
  }, 160);
  syncSaveButton();
}

function pool() {
  return filter === "All" ? PROMPTS : PROMPTS.filter(p => p.c === filter);
}

function another() {
  const p = pool();
  if (!p.length) return;
  let next = p[Math.floor(Math.random() * p.length)];
  if (p.length > 1) {
    while (current && next.t === current.t) next = p[Math.floor(Math.random() * p.length)];
  }
  render(next, false);
}

function buildFilters() {
  const wrap = $("filters");
  CATEGORIES.forEach(cat => {
    const chip = document.createElement("button");
    chip.className = "chip" + (cat === filter ? " active" : "");
    chip.textContent = cat;
    chip.onclick = () => {
      filter = cat;
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.textContent === cat));
      another();
    };
    wrap.append(chip);
  });
}

function syncSaveButton() {
  const btn = $("save");
  const isSaved = current && saved.some(s => s.t === current.t);
  btn.classList.toggle("saved", isSaved);
  btn.querySelector("svg").setAttribute("fill", isSaved ? "currentColor" : "none");
  btn.lastChild.textContent = isSaved ? " Saved" : " Save prompt";
}

function toggleSave() {
  if (!current) return;
  const i = saved.findIndex(s => s.t === current.t);
  if (i >= 0) { saved.splice(i, 1); toast("Removed"); }
  else { saved.unshift({ ...current }); toast("Saved for this session"); }
  renderSaved();
  syncSaveButton();
}

function renderSaved() {
  $("saved-count").textContent = saved.length ? "(" + saved.length + ")" : "";
  const list = $("saved-list");
  list.innerHTML = "";
  if (!saved.length) {
    const e = document.createElement("div");
    e.className = "saved-empty";
    e.textContent = "Nothing saved yet. Keep the ones worth returning to.";
    list.append(e);
    return;
  }
  saved.forEach((s, idx) => {
    const row = document.createElement("div");
    row.className = "saved-item";
    const txt = document.createElement("div");
    txt.className = "saved-text";
    txt.textContent = s.t;
    const actions = document.createElement("div");
    actions.className = "saved-actions";
    const cp = document.createElement("button");
    cp.className = "saved-btn";
    cp.setAttribute("aria-label", "Copy this prompt");
    cp.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    cp.onclick = () => copyText(s.t);
    const rm = document.createElement("button");
    rm.className = "saved-btn";
    rm.setAttribute("aria-label", "Remove saved prompt");
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    rm.onclick = () => { saved.splice(idx, 1); renderSaved(); syncSaveButton(); };
    actions.append(cp, rm);
    row.append(txt, actions);
    list.append(row);
  });
}

function copyText(text) {
  const done = () => toast("Copied");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.append(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}
function copyCurrent() { if (current) copyText(current.t); }

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

function setTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
}

setTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
setDate();
buildFilters();
renderSaved();
render(PROMPTS[dailyIndex()], true);

$("another").onclick = another;
$("copy").onclick = copyCurrent;
$("save").onclick = toggleSave;
$("theme").onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON") return;
  const k = e.key.toLowerCase();
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); another(); }
  else if (k === "s") toggleSave();
  else if (k === "c") copyCurrent();
});
</script>
</body>
</html>
